name: Gemini Terraform Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'

jobs:
  review:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    env:
      GOOGLE_GENAI_USE_VERTEXAI: true
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gh CLI
        run: sudo apt install gh -y

      - name: Authenticate gh
        run: echo "${{ secrets.TFSEC_GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Setup Node.js & npm
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install official Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Verify Gemini CLI
        run: gemini --version

      - name: Set up GCP credentials and install local Gemini extension
        run: |
          # Write the JSON key from the secret into a file
          echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > $HOME/gcp-key.json

          # Set environment variables for Vertex AI
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-key.json
          export GOOGLE_CLOUD_PROJECT=$(jq -r '.project_id' $HOME/gcp-key.json)
          export GOOGLE_CLOUD_LOCATION=global

          echo "Using GCP Project: $GOOGLE_CLOUD_PROJECT"

          # Install the local Gemini extension
          echo "y" | gemini extensions install https://github.com/PrzemyslawSwierzewski/tarot-gemini-review-extension.git
        shell: bash

      - name: Run Terraform Review
        run: |
          gemini -y /pr:review:terraform "${{ github.event.pull_request.number }}"