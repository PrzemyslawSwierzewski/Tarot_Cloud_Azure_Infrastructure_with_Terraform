name: Gemini Terraform Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'

jobs:
  review:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    env:
      GOOGLE_GENAI_USE_VERTEXAI: true
      GH_TOKEN: ${{ secrets.TFSEC_GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install official Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Set up GCP and Install Extension
        shell: bash
        run: |
          # 1. Create the key file
          echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > $HOME/gcp-key.json
          
          # 2. Extract Project ID
          PROJECT_ID=$(jq -r '.project_id' $HOME/gcp-key.json)
          
          # 3. Persist variables to GITHUB_ENV for subsequent steps
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-key.json" >> $GITHUB_ENV
          echo "GOOGLE_CLOUD_PROJECT=$PROJECT_ID" >> $GITHUB_ENV
          echo "GOOGLE_CLOUD_LOCATION=global" >> $GITHUB_ENV

          # 4. Install the Gemini extension
          echo "y" | gemini extensions install https://github.com/PrzemyslawSwierzewski/tarot-gemini-review-extension.git

      - name: Run Terraform Review
        run: |
          # The CLI will now see the credentials and project ID set in the previous step
          gemini -y /pr:review:terraform "${{ github.event.pull_request.number }}"